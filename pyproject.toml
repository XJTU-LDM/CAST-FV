[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cast-fv"
version = "0.1.0"
description = "Compact solution-label-free neural optimization of finite-volume states"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Demin Liu", email = "liudemin@stu.xjtu.edu.cn"},
]
keywords = [
  "finite volume method",
  "physics-informed machine learning",
  "neural PDE solver",
  "solution-label-free optimization",
  "unsteady incompressible flow",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
castfv = "castfv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
